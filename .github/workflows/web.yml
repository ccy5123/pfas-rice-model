name: web front end

# Type-checks, tests and builds the React front end (frontend/), and runs the FastAPI
# backend's contract tests (tests/test_web_api.py). tests.yml installs requirements.txt
# only, so there tests/test_web_api.py skips (no fastapi); the backend job below is where
# it runs. The vitest suite pins the browser-side plant map byte-for-byte to
# src/plot_svg.py and the number formatting to Python's format(), so the web UI cannot
# silently draw or print something different from the Streamlit app.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt pytest
      - run: pytest -q -rs tests/test_web_api.py
